<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mrj-build" content="20261013-chooser" />
  <title>English Skill Builder</title>
  <link rel="stylesheet" href="chooser.css?v=20261013-chooser" />
</head>
<body>
  <main class="chooser" id="chooser">
    <header class="chooser-head">
      <p class="chooser-kicker">MRJ English</p>
      <h1>Skill Builder</h1>
      <p class="chooser-lead">Pick your grade. Sign in on the next screen with your MRJ ID.</p>
    </header>
    <div class="grade-stack" role="list">
      <a class="grade-card grade-1" href="grade1/" role="listitem">
        <span class="grade-bar" aria-hidden="true"></span>
        <span class="grade-body">
          <span class="grade-name">Grade 1</span>
          <span class="grade-meta">Phonics · Reading · Grammar · Vocabulary</span>
          <span class="grade-cta">Open Grade 1</span>
        </span>
      </a>
      <a class="grade-card grade-2" href="grade2/" role="listitem">
        <span class="grade-bar" aria-hidden="true"></span>
        <span class="grade-body">
          <span class="grade-name">Grade 2</span>
          <span class="grade-meta">Phonics · Reading · Writing · Grammar · Vocabulary · 160 skills</span>
          <span class="grade-cta">Open Grade 2</span>
        </span>
      </a>
    </div>
    <p class="chooser-foot muted">W.A.I.T. 4 LANGUAGES · MRJ English</p>
  </main>
</body>
</html>
